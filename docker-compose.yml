services:
  server:
    build:
      context: .
    image: telco-troubleshooting-track-b-server:local
    ports:
      - "7860:7860"
    environment:
      TELCO_PRELOAD_COMMANDS: "0"
    volumes:
      - ./devices_outputs:/app/devices_outputs:ro
    healthcheck:
      test: ["CMD", "python", "scripts/smoke_server.py", "--timeout", "10"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 60s

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile.agent
    image: telco-troubleshooting-track-b-agent:local
    depends_on:
      server:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - .:/app
    # Run an infinite loop so the container stays alive, allowing us to exec into it
    command: tail -f /dev/null

  llm:
    image: vllm/vllm-openai:latest
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models
    environment:
      # Expose a HuggingFace cache folder locally
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Replace 'Qwen/Qwen2.5-1.5B-Instruct' with your exact local model path or HuggingFace repo
    # e.g., --model /models/Qwen3.5-35B-A3B if you downloaded the weights locally
    # Note: 1.5B model is used by default here because your GPU has 6GB VRAM.
    command: --model Qwen/Qwen2.5-1.5B-Instruct --host 0.0.0.0 --port 8000 --max-model-len 2048
